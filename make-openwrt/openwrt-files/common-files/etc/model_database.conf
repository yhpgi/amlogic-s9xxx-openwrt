#
# Function: Define the list of supported devices
#
# Column definitions:
# 1.ID  2.MODEL  3.SOC  4.FDTFILE  5.UBOOT_OVERLOAD  6.MAINLINE_UBOOT  7.BOOTLOADER_IMG  8.DESCRIPTION
# 9.KERNEL_TAGS  10.PLATFORM  11.FAMILY  12.BOOT_CONF  13.CONTRIBUTORS  14.BOARD  15.BUILD
#
# [ 5.UBOOT_OVERLOAD ] : Referred to as <UBOOT_OVERLOAD> for Amlogic, <TRUST_IMG> for Rockchip, not used for Allwinner.
# [ 9.KERNEL_TAGS    ] : The tag name suffix used in https://github.com/ophub/kernel/releases
#                        [ Kernel tags      ] start with [ kernel_ ], e.g., kernel_stable, kernel_rk3588, etc.
#                        [ Common kernels   ] include [ kernel_stable, kernel_flippy, and kernel_beta ], which can be used interchangeably.
#                        [ Specific kernels ] use specific kernel versions, downloaded from [ kernel_stable ] tags by default, can be replaced with [ common kernels ].
#                                             You can specify multiple kernel version matching formats, e.g., 6.1.43, 5.15.y, 6.x.y, 5.15.y_6.1.y, etc.
#                                             Where [ 5.x.y ] includes 5.10.y, 5.15.y, and [ 6.x.y ] includes 6.1.y, 6.6.y, 6.12.y, and 6.18.y.
#                        [ stable/all   ] = [ kernel_stable/*     ] : Available for all devices.
#                        [ stable/6.x.y ] = [ kernel_stable/6.x.y ] : Available for all devices; Rockchip rk3399/rk3568 series devices use specified kernels.
#                        [ stable/5.x.y ] = [ kernel_stable/5.x.y ] : Available for all Amlogic devices.
#                        [ flippy/all   ] = [ kernel_flippy/*     ] : Available for all devices.
#                        [ beta/all     ] = [ kernel_beta/*       ] : Available for all devices.
#                        [ rk3588/6.1.y ] = [ kernel_rk3588/6.1.y ] : Dedicated to Rockchip rk3588 series devices.
#                        [ rk35xx/6.1.y ] = [ kernel_rk35xx/6.1.y ] : Dedicated to Rockchip rk3528/rk3566/rk3568 series devices.
#                        [ h6/6.6.y     ] = [ kernel_h6/6.6.y     ] : Dedicated to Allwinner h6 (TQC-A01) device.
# [ 13.CONTRIBUTORS  ] : GitHub username of the contributor (https://github.com)
#
# When [ -b all      ], selects [ all rows ] where [ BUILD is yes ].
# When [ -b first<N> ], selects [ first N rows ] where [ BUILD is yes ].
# When [ -b from<N>  ], selects [ rows from N+1 to end ] where [ BUILD is yes ].
# When [ -b last<N>  ], selects [ last N rows ] where [ BUILD is yes ].
# When [ -b board    ], selects [ first row ] with [ matching BOARD ], ignoring [ BUILD ].
#
# Tip: [IDL]: ID Locked. Do not modify.
#      For [ 2.MODEL ] entries marked with [IDL], a fixed [ ID ] is required (e.g., [ 213, 304, 409 ]). Do not change these in the [ install/update script ].
#
#=========================================================================================================================================================================

